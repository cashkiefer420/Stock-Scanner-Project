<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Filter</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40;
        }

        #filterForm {
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        #filterForm div {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #495057;
        }

        table {
            margin-top: 20px;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }

        thead {
            background-color: #007bff;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        button {
            margin-right: 10px;
        }
    </style>

    <!-- jQuery and DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Stock Filter</h1>

        <!-- Filter Form -->
        <form id="filterForm" class="p-4">
            <h4 class="mb-3">Filter Stocks</h4>
            <div id="filterContainer" class="row"></div>
            <div class="mt-4 text-center">
                <button type="button" class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                <button type="button" class="btn btn-success" onclick="downloadFiltered()">Download CSV</button>
            </div>
        </form>

        <!-- Filtered Results Table -->
        <h2>Filtered Results</h2>
        <table id="stockTable" class="display table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Current Price</th>
                    <th>Price Change Today</th>
                    <th>Days Range</th>
                    <th>Shares Available</th>
                    <th>Day Volume</th>
                    <th>Average Volume</th>
                    <th>DVAV</th>
                    <th>Market Cap</th>
                    <th>Market Cap Change</th>
                    <th>P/E Ratio</th>
                    <th>P/E Change</th>
                    <th>Dividend Yield</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        // Fields to filter
        const fields = [
            "Current Price", "Price Change Today", "Days Range", "Shares Available",
            "Day Volume", "Average Volume", "DVAV", "Market Cap", 
            "Market Cap Change", "P/E Ratio", "P/E Change", "Dividend Yield"
        ];

        // Dynamically create filter inputs
        const filterContainer = document.getElementById('filterContainer');
        fields.forEach(field => {
            const div = document.createElement('div');
            div.className = "col-md-6";
            div.innerHTML = `
                <label for="${field}">${field}:</label>
                <div class="input-group">
                    <select id="${field}Condition" class="form-select">
                        <option value="greater_than">Greater Than</option>
                        <option value="less_than">Less Than</option>
                        <option value="equal_to">Equal To</option>
                    </select>
                    <input type="number" id="${field}Value" class="form-control" value="0" step="0.01">
                </div>
            `;
            filterContainer.appendChild(div);
        });

        function applyFilters() {
            const filters = {};

            fields.forEach(field => {
                const condition = document.getElementById(`${field}Condition`).value;
                const value = parseFloat(document.getElementById(`${field}Value`).value) || 0; // Default to 0 if blank
                filters[field] = { type: condition, value: value };
            });

            fetch('/filter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(filters)
            })
            .then(response => response.json())
            .then(data => {
                const tableBody = document.querySelector('#stockTable tbody');
                tableBody.innerHTML = '';
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.Ticker}</td>
                        <td>${row['Current Price']}</td>
                        <td>${row['Price Change Today']}</td>
                        <td>${row['Days Range']}</td>
                        <td>${row['Shares Available']}</td>
                        <td>${row['Day Volume']}</td>
                        <td>${row['Average Volume']}</td>
                        <td>${row.DVAV}</td>
                        <td>${row['Market Cap']}</td>
                        <td>${row['Market Cap Change']}</td>
                        <td>${row['P/E Ratio']}</td>
                        <td>${row['P/E Change']}</td>
                        <td>${row['Dividend Yield']}</td>
                    `;
                    tableBody.appendChild(tr);
                });

                // Initialize DataTables
                $('#stockTable').DataTable();
            });
        }

        function downloadFiltered() {
            const filters = {};

            fields.forEach(field => {
                const condition = document.getElementById(`${field}Condition`).value;
                const value = parseFloat(document.getElementById(`${field}Value`).value) || 0; // Default to 0 if blank
                filters[field] = { type: condition, value: value };
            });

            fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(filters)
            })
            .then(response => {
                if (response.ok) {
                    return response.blob();
                }
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'filtered_stocks.csv';
                document.body.appendChild(a);
                a.click();
                a.remove();
            });
        }
    </script>
</body>
</html>
