<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Subscription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index_sub.css') }}">
</head>
<body>
    <div class="container">
        <h1>Subscribe to Price Increase Stock Alerts</h1>
        <form id="subscription-form">
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
            <button type="submit">Subscribe</button>
        </form>
        <p id="response-message" style="color: green; display: none;"></p>
    </div>

    <script>
        const form = document.getElementById('subscription-form');
        const responseMessage = document.getElementById('response-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent form submission refresh
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/subscribe-mc-20-in', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                const result = await response.json();
                responseMessage.style.display = 'block';
                responseMessage.textContent = result.message;

                if (response.ok) {
                    responseMessage.style.color = 'green';
                } else {
                    responseMessage.style.color = 'red';
                }
            } catch (error) {
                responseMessage.style.display = 'block';
                responseMessage.style.color = 'red';
                responseMessage.textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
